# PART 07 §72-§74 — Redis hardening.
bind 0.0.0.0
# Redis is reachable only on the Compose data network in the local stack.
# Production must enable authentication/ACL before exposing any Redis endpoint.
protected-mode no
appendonly yes
appendfsync everysec
maxmemory 256mb
maxmemory-policy allkeys-lru

# ACL (enable in production with a strong password):
# user growth on >REDIS_PASSWORD~* &* +@all
# rename-command FLUSHALL ""
# rename-command FLUSHDB ""

# TLS (enable when terminating TLS at Redis):
# tls-port 6379
# tls-cert-file /tls/redis.crt
# tls-key-file /tls/redis.key
