[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dtc-growth-browser-worker"
version = "0.1.0"
description = "AI DTC Growth Automation System - macOS Browser Worker"
requires-python = ">=3.9"
dependencies = [
  "playwright>=1.42",
  "redis>=5.0",
  "celery[redis]>=5.3",
  "httpx>=0.27",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2",
  "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501"]
