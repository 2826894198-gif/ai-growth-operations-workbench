# ---------------------------------------------------------------------------
# Growth Rule Engine - SEED DEFAULTS
#
# These are starting priors, not universal platform best practices.
# Brand/account/campaign-specific overrides live in rule_parameters (DB).
# ---------------------------------------------------------------------------

rule_packs:
  core_safety: true
  meta_performance: true
  google_search: true
  funnel: true
  commerce: true
  cross_channel: true

confidence_weights:
  data_freshness: 0.20
  sample_reliability: 0.25
  rule_strength: 0.25
  signal_agreement: 0.20
  cross_source: 0.10

sample_reliability:
  spend_maturity_pct: 30
  click_maturity_pct: 20
  purchase_maturity_pct: 30
  active_duration_pct: 20
  min_spend_units: 30.0
  min_clicks_units: 50
  min_purchases_units: 3
  min_active_hours: 24

meta:
  no_purchase_burn:
    burn_multiple: 2.0
    min_age_hours: 24
    min_clicks: 30
    cooldown_hours: 24
  cpa_overshoot:
    cpa_multiple: 1.5
    min_purchase_sample: 3
    cooldown_hours: 24
  scale_candidate:
    min_purchases: 5
    min_stable_hours: 48
    max_suggested_step_pct: 20
    cooldown_hours: 24
  creative_fatigue:
    ctr_drop_pct: 20
    frequency_elevated_multiple: 1.2
    cpa_worsen_pct: 10
    cooldown_hours: 24
  low_ctr:
    ctr_drop_pct: 30
    min_impressions: 10000
  cpm_shock:
    zscore: 2.5
  delivery_collapse:
    drop_pct: 60
  audience_saturation:
    frequency_rise_pct: 25
    reach_slowdown_pct: 20

google:
  no_conversion_burn:
    burn_multiple: 2.0
    min_age_hours: 24
    min_clicks: 20
    cooldown_hours: 24
  cpa_overshoot:
    cpa_multiple: 1.5
    min_conversion_sample: 3
    cooldown_hours: 24
  search_term_waste:
    spend_cpa_multiple: 1.5
    min_clicks: 10
    cooldown_hours: 48
  keyword_waste:
    spend_cpa_multiple: 1.5
    min_clicks: 20
  cpc_shock:
    zscore: 2.5
  ctr_weakness:
    drop_pct: 30
    min_impressions: 5000

funnel:
  ctr_min: 0.004
  click_to_lpv_min: 0.5
  lpv_to_atc_min: 0.05
  atc_to_checkout_min: 0.4
  checkout_to_purchase_min: 0.4

commerce:
  revenue_drop_pct: 25
  refund_rate_warning: 0.05
  refund_rate_critical: 0.10
  aov_drop_pct: 20

cross_channel:
  blended_roas_warning_days: 3
  spend_divergence_pct: 30
  attribution_overlap_multiple: 1.3
  channel_concentration_pct: 0.9
