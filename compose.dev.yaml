services:
  backend:
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app:ro
  dashboard:
    build:
      target: development
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports: !override
      - "127.0.0.1:${DASHBOARD_PORT:-15173}:5173"
    volumes:
      - ./frontend/src:/app/src:ro
